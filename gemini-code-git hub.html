<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CGE ARSTM — Portail Officiel & Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<!-- Client SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          serif: ['"Playfair Display"', 'Georgia', 'serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin:0; background:#FDFBF6; }
  @keyframes gentle-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .animate-bounce { animation: gentle-bounce 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// --- INITIALISATION SUPABASE AVEC VOS IDENTIFIANTS ---
const SUPABASE_URL = "https://vpzxsksbzzbncqawzium.supabase.co";
const SUPABASE_KEY = "sb_publishable_Or7mvR3xPajl0zxFZdV1XQ_j3jvr";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const Icon = ({ children, className = "w-5 h-5" }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const Home = (p) => <Icon {...p}><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v10h14V10" /><path d="M9.5 20v-6h5v6" /></Icon>;
const Users = (p) => <Icon {...p}><circle cx="9" cy="8" r="3.2" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" /><circle cx="17" cy="9" r="2.6" /><path d="M15.5 14c2.8.4 4.5 2.4 4.5 5.5" /></Icon>;
const Briefcase = (p) => <Icon {...p}><rect x="3" y="7.5" width="18" height="12" rx="2" /><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5" /><path d="M3 12.5h18" /></Icon>;
const GraduationCap = (p) => <Icon {...p}><path d="M2 8.5 12 4l10 4.5-10 4.5-10-4.5Z" /><path d="M6 11v5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5" /><path d="M21 9v6" /></Icon>;
const Key = (p) => <Icon {...p}><circle cx="8" cy="8" r="4" /><path d="M11 11l9 9" /><path d="M15.5 15.5l2.5-2.5M18.5 18.5l2-2" /></Icon>;
const UserCheck = (p) => <Icon {...p}><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" /><path d="M16.5 12.5 18.5 14.5 22 10.5" /></Icon>;
const Search = (p) => <Icon {...p}><circle cx="10.5" cy="10.5" r="6.5" /><path d="M20 20l-4.8-4.8" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M4 20h16" /></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M4 7h16" /><path d="M9 7V4.5h6V7" /><path d="M6 7l1 13h10l1-13" /><path d="M10 11v6M14 11v6" /></Icon>;
const RotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></Icon>;
const CheckCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.5 2.5L16 9.5" /></Icon>;
const Menu = (p) => <Icon {...p}><path d="M4 6h16M4 12h16M4 18h16" /></Icon>;
const LogOut = (p) => <Icon {...p}><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9" /><path d="M14 16l4-4-4-4" /><path d="M18 12H9" /></Icon>;
const Sparkles = (p) => <Icon {...p}><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6Z" /><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7Z" /></Icon>;
const PlusCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M12 8v8M8 12h8" /></Icon>;
const Newspaper = (p) => <Icon {...p}><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2" /><path d="M18 14h-8" /><path d="M18 18h-8" /><path d="M18 10h-8" /></Icon>;
const ShieldCheck = (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></Icon>;

const LogoCGE = ({ className = "w-10 h-10" }) => (
  <svg className={className} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 25 C100 25 118 60 118 90 C118 105 110 115 100 120 C90 115 82 105 82 90 C82 60 100 25 100 25 Z" fill="#EA580C" opacity="0.15"/>
    <path d="M100 15 C100 15 122 55 122 90 C122 110 112 122 100 128 C88 122 78 110 78 90 C78 55 100 15 100 15 Z" stroke="#EA580C" strokeWidth="6" strokeLinejoin="round"/>
    <path d="M100 25 L100 120 M85 45 Q100 55 115 45 M83 65 Q100 75 117 65 M82 85 Q100 95 118 85" stroke="#EA580C" strokeWidth="4" strokeLinecap="round"/>
    <path d="M100 35 L50 75 L150 75 Z" stroke="#EA580C" strokeWidth="5" fill="none"/>
    <circle cx="100" cy="115" r="70" stroke="#EA580C" strokeWidth="10" strokeDasharray="18 10" fill="none"/>
    <path d="M 35 120 Q 100 145 165 120 L 160 140 Q 100 165 40 140 Z" fill="#EA580C"/>
    <text x="100" y="137" textAnchor="middle" fill="#FDFBF6" fontFamily="Inter, sans-serif" fontWeight="800" fontSize="18" letterSpacing="2">ARSTM</text>
    <text x="60" y="90" textAnchor="middle" fill="#EA580C" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="22">C</text>
    <text x="140" y="90" textAnchor="middle" fill="#EA580C" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="22">G</text>
    <text x="100" y="180" textAnchor="middle" fill="#EA580C" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="22">E</text>
  </svg>
);

function App() {
  const [activeTab, setActiveTab] = useState('accueil');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [toast, setToast] = useState(null);

  // Données Supabase
  const [members, setMembers] = useState([]);
  const [alumni, setAlumni] = useState([]);
  const [news, setNews] = useState([]);
  const [loading, setLoading] = useState(true);

  // Authentification
  const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [showMemberModal, setShowMemberModal] = useState(false);

  // Recherche
  const [searchTerm, setSearchTerm] = useState('');

  // Formulaires Admin
  const [newMemberForm, setNewMemberForm] = useState({ name: '', role: '', matricule: '', bio: '', image: '' });
  const [newNewsForm, setNewNewsForm] = useState({ title: '', type: 'Annonce', content: '' });

  const showToastMsg = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3500);
  };

  // Chargement des données depuis la base Supabase
  const fetchData = async () => {
    setLoading(true);
    const { data: mData } = await db.from('members').select('*');
    const { data: aData } = await db.from('alumni').select('*');
    const { data: nData } = await db.from('news').select('*').order('created_at', { ascending: false });

    if (mData) setMembers(mData);
    if (aData) setAlumni(aData);
    if (nData) setNews(nData);
    setLoading(false);
  };

  useEffect(() => { fetchData(); }, []);

  const handleAddMember = async (e) => {
    e.preventDefault();
    if (!newMemberForm.name || !newMemberForm.role) {
      showToastMsg("Veuillez remplir le nom et le rôle.");
      return;
    }
    const mat = newMemberForm.matricule || `2026-ARSTM-${members.length + 1}`;

    const { error } = await db.from('members').insert([{
      name: newMemberForm.name,
      role: newMemberForm.role,
      matricule: mat,
      bio: newMemberForm.bio || "Membre de la CGE ARSTM",
      image: newMemberForm.image || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400"
    }]);

    if (!error) {
      showToastMsg(`Membre ${newMemberForm.name} ajouté au serveur !`);
      setNewMemberForm({ name: '', role: '', matricule: '', bio: '', image: '' });
      fetchData();
    } else {
      showToastMsg("Erreur d'ajout dans la base.");
    }
  };

  const handleAddNews = async (e) => {
    e.preventDefault();
    if (!newNewsForm.title || !newNewsForm.content) return;

    const { error } = await db.from('news').insert([{
      title: newNewsForm.title,
      type: newNewsForm.type,
      content: newNewsForm.content
    }]);

    if (!error) {
      showToastMsg("Publication enregistrée dans la base !");
      setNewNewsForm({ title: '', type: 'Annonce', content: '' });
      fetchData();
    }
  };

  const filteredMembers = members.filter(m => 
    !m.is_deleted && 
    (m.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
     m.role.toLowerCase().includes(searchTerm.toLowerCase()) ||
     m.matricule.toLowerCase().includes(searchTerm.toLowerCase()))
  );

  return (
    <div className="min-h-screen flex flex-col bg-[#FDFBF6] text-stone-800 font-sans">
      {/* Toast Notification */}
      {toast && (
        <div className="fixed bottom-6 right-6 z-50 bg-stone-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-stone-700 animate-bounce">
          <CheckCircle className="text-orange-500 w-5 h-5 flex-shrink-0" />
          <span className="text-sm font-medium">{toast}</span>
        </div>
      )}

      {/* Navigation / Header */}
      <header className="sticky top-0 z-40 bg-[#FDFBF6]/90 backdrop-blur-md border-b border-stone-200/80">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
          <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('accueil')}>
            <LogoCGE className="w-12 h-12" />
            <div>
              <h1 className="font-serif font-bold text-xl text-stone-900">CGE ARSTM</h1>
              <p className="text-xs text-stone-500 font-medium hidden sm:block">Conférence des Grandes Écoles</p>
            </div>
          </div>

          <nav className="hidden lg:flex items-center gap-1 bg-stone-100 p-1.5 rounded-2xl">
            {[
              { id: 'accueil', label: 'Accueil', icon: Home },
              { id: 'bureau', label: 'Bureau & Membres', icon: Users },
              { id: 'alumni', label: 'Alumni', icon: GraduationCap },
              { id: 'actualites', label: 'Actualités & Offres', icon: Newspaper },
              ...(isAdminLoggedIn ? [{ id: 'admin-panel', label: 'Administration', icon: ShieldCheck }] : [])
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setActiveTab(item.id)}
                className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium transition ${
                  activeTab === item.id ? 'bg-white text-orange-600 shadow-sm font-semibold' : 'text-stone-600 hover:bg-white/50'
                }`}
              >
                <item.icon className="w-4 h-4" />
                {item.label}
              </button>
            ))}
          </nav>
        </div>
      </header>

      {/* Corps principal */}
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {loading ? (
          <div className="text-center py-20 text-stone-500 font-semibold">Connexion à la base de données Supabase CGE ARSTM...</div>
        ) : (
          <>
            {activeTab === 'accueil' && (
              <div className="rounded-3xl bg-stone-900 text-white p-8 sm:p-12 shadow-2xl space-y-6">
                <span className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-orange-500/20 text-orange-400 border border-orange-500/30 text-xs font-semibold uppercase">
                  <Sparkles className="w-3.5 h-3.5" /> ARSTM Abidjan
                </span>
                <h2 className="font-serif text-3xl sm:text-5xl font-bold">Portail Officiel CGE ARSTM</h2>
                <p className="text-stone-300 max-w-2xl leading-relaxed">
                  Base de données collaborative en temps réel pour l'annuaire, les alumni et les offres de stages.
                </p>
              </div>
            )}

            {activeTab === 'bureau' && (
              <div className="space-y-8">
                <div className="flex justify-between items-center flex-wrap gap-4">
                  <div>
                    <h2 className="font-serif text-3xl font-bold text-stone-900">Bureau Exécutif & Membres</h2>
                    <p className="text-stone-500">Membres enregistrés dans la base cloud</p>
                  </div>
                </div>

                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredMembers.map(m => (
                    <div key={m.id} className="bg-white rounded-3xl overflow-hidden border border-stone-200 shadow-sm flex flex-col p-6 space-y-4">
                      <img src={m.image} alt={m.name} className="w-full h-48 object-cover rounded-2xl" />
                      <div>
                        <span className="text-xs font-bold uppercase text-orange-600 bg-orange-50 px-3 py-1 rounded-full inline-block mb-2">
                          {m.role}
                        </span>
                        <h3 className="font-serif text-xl font-bold text-stone-900">{m.name}</h3>
                        <p className="text-stone-600 text-sm mt-2">{m.bio}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </>
        )}
      </main>

      <footer className="bg-stone-900 text-white border-t border-stone-800 py-8 mt-16 text-center text-xs text-stone-500">
        &copy; 2026 CGE ARSTM. Synchronisé avec Supabase.
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
