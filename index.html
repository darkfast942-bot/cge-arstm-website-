                <div key={m.id} className="glass-card rounded-3xl overflow-hidden hover-scale flex flex-col">
                  <img src={m.image} alt={m.name} className="w-full h-56 object-cover" />
                  <div className="p-6 flex-1 flex flex-col justify-between space-y-4">
                    <div>
                      <span className="text-[10px] font-extrabold uppercase tracking-widest text-orange-600 bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full inline-block mb-2">
                        {m.role}
                      </span>
                      <h3 className="font-serif text-xl font-bold text-stone-900">{m.name}</h3>
                      <p className="text-stone-600 text-sm mt-2 leading-relaxed">{m.bio}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* EMPLOIS & STAGES VIEW */}
        {activeTab === 'emplois' && (
          <div className="space-y-8">
            <div>
              <h2 className="font-serif text-3xl font-bold text-stone-900">Offres d'Emplois & Stages</h2>
              <p className="text-stone-500">Opportunités professionnelles maritimes et industrielles</p>
            </div>
            <div className="space-y-4">
              {jobs.map(j => (
                <div key={j.id} className="glass-card p-6 rounded-3xl hover-scale flex flex-col md:flex-row md:items-center justify-between gap-6">
                  <div className="space-y-2">
                    <span className="text-xs font-bold text-emerald-700 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">{j.type}</span>
                    <h3 className="font-serif text-xl font-bold text-stone-900">{j.title}</h3>
                    <p className="text-sm font-semibold text-stone-600 flex items-center gap-2"><Building className="w-4 h-4 text-orange-600" /> {j.company}</p>
                    <p className="text-stone-600 text-sm">{j.desc}</p>
                  </div>
                  <button onClick={() => showToastMsg("Candidature transmise avec succès !")} className="hover-scale px-6 py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 whitespace-nowrap">
                    Postuler
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ACTIVITES VIEW */}
        {activeTab === 'activites' && (
          <div className="space-y-8">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Activités & Projets</h2>
            <div className="glass-card p-8 rounded-3xl text-center space-y-4">
              <Calendar className="w-12 h-12 mx-auto text-orange-600" />
              <h3 className="font-serif text-xl font-bold">Calendrier des événements à venir</h3>
              <p className="text-stone-600 text-sm max-w-md mx-auto">Consultez régulièrement cette rubrique pour suivre les ateliers technologiques, séminaires et rencontres sportives.</p>
            </div>
          </div>
        )}

        {/* ALUMNI VIEW */}
        {activeTab === 'alumni' && (
          <div className="space-y-8">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Réseau Alumni</h2>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {alumni.map(a => (
                <div key={a.id} className="glass-card p-6 rounded-3xl hover-scale space-y-3">
                  <div className="flex justify-between items-start">
                    <h3 className="font-serif text-lg font-bold text-stone-900">{a.name}</h3>
                    <span className="text-xs font-bold text-orange-600 bg-orange-500/10 px-2.5 py-1 rounded-lg">Promo {a.promo}</span>
                  </div>
                  <p className="text-sm font-semibold text-stone-700">{a.role}</p>
                  <p className="text-xs text-stone-500 flex items-center gap-1.5"><Building className="w-4 h-4 text-orange-500" /> {a.company}</p>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* MEDIATHEQUE VIEW */}
        {activeTab === 'mediatheque' && (
          <div className="space-y-8">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Médiathèque Officielle</h2>
            <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-6">
              {gallery.map(item => (
                <div key={item.id} className="glass-card rounded-3xl overflow-hidden hover-scale group">
                  <img src={item.image} alt={item.title} className="w-full h-52 object-cover transition duration-500 group-hover:scale-105" />
                  <div className="p-5">
                    <h4 className="font-serif font-bold text-stone-900">{item.title}</h4>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* CONTACT VIEW */}
        {activeTab === 'contact' && (
          <div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl space-y-6">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Contact</h2>
            <p className="text-stone-600 text-sm">Secrétariat de la Conférence des Grandes Écoles — ARSTM, Abidjan, Côte d'Ivoire.</p>
          </div>
        )}

      </main>

      {/* BARRE EN BAS : APPLE LIQUID GLASS DOCK */}
      <div className="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
        <nav
          ref={navRef}
          onMouseLeave={() => setHoveredTab(null)}
          className="pointer-events-auto relative glass-dock p-2 rounded-full flex items-center gap-1 max-w-full overflow-x-auto no-scrollbar"
        >
          {/* Pilule suiveuse (Apple Liquid Indicator) */}
          <div
            className="absolute top-2 bottom-2 liquid-pill rounded-full pointer-events-none"
            style={{
              left: `${pillStyle.left}px`,
              width: `${pillStyle.width}px`,
              opacity: pillStyle.opacity,
            }}
          />

          {navItems.map(item => {
            const Icon = item.icon;
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                data-tab={item.id}
                onClick={() => setActiveTab(item.id)}
                onMouseEnter={() => setHoveredTab(item.id)}
                className={`relative z-10 flex items-center gap-2 px-4 py-3 rounded-full text-xs font-bold transition-transform duration-300 transform hover:scale-110 active:scale-95 whitespace-nowrap ${
                  isActive || hoveredTab === item.id ? 'text-white' : 'text-stone-700 hover:text-stone-950'
                }`}
              >
                <Icon className="w-4 h-4" />
                <span className="hidden sm:inline">{item.label}</span>
              </button>
            );
          })}
        </nav>
      </div>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
