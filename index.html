<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />

<title>CGE ARSTM — Portail Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

  tailwind.config = {

<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin:0; background:#FDFBF6; }
  @keyframes gentle-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .animate-bounce { animation: gentle-bounce 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const Icon = ({ children, className = "w-5 h-5" }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const Home = (p) => <Icon {...p}><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v10h14V10" /><path d="M9.5 20v-6h5v6" /></Icon>;
const Users = (p) => <Icon {...p}><circle cx="9" cy="8" r="3.2" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" /><circle cx="17" cy="9" r="2.6" /><path d="M15.5 14c2.8.4 4.5 2.4 4.5 5.5" /></Icon>;
const Briefcase = (p) => <Icon {...p}><rect x="3" y="7.5" width="18" height="12" rx="2" /><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5" /><path d="M3 12.5h18" /></Icon>;
const Calendar = (p) => <Icon {...p}><rect x="3.5" y="5" width="17" height="16" rx="2" /><path d="M8 3v4M16 3v4M3.5 10h17" /></Icon>;
const GraduationCap = (p) => <Icon {...p}><path d="M2 8.5 12 4l10 4.5-10 4.5-10-4.5Z" /><path d="M6 11v5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5" /><path d="M21 9v6" /></Icon>;
const ImgIcon = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="1.8" /><path d="M4 18l5.5-5.5a2 2 0 0 1 2.8 0L20 20" /></Icon>;
const FileText = (p) => <Icon {...p}><path d="M7 3h7l5 5v13H7Z" /><path d="M14 3v5h5" /><path d="M9.5 13h6M9.5 16.5h6" /></Icon>;
const MessageSquare = (p) => <Icon {...p}><path d="M4 4h16v12H8l-4 4Z" /></Icon>;
const Mail = (p) => <Icon {...p}><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3.5 6.5 12 13l8.5-6.5" /></Icon>;
const Key = (p) => <Icon {...p}><circle cx="8" cy="8" r="4" /><path d="M11 11l9 9" /><path d="M15.5 15.5l2.5-2.5M18.5 18.5l2-2" /></Icon>;
const UserCheck = (p) => <Icon {...p}><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" /><path d="M16.5 12.5 18.5 14.5 22 10.5" /></Icon>;
const ShieldCheck = (p) => <Icon {...p}><path d="M12 3l7 3v6c0 4.8-3 8-7 9-4-1-7-4.2-7-9V6Z" /><path d="M9 12l2 2 4-4.5" /></Icon>;
const Search = (p) => <Icon {...p}><circle cx="10.5" cy="10.5" r="6.5" /><path d="M20 20l-4.8-4.8" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M4 20h16" /></Icon>;
const Upload = (p) => <Icon {...p}><path d="M12 15V3" /><path d="M7 8l5-5 5 5" /><path d="M4 20h16" /></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M4 7h16" /><path d="M9 7V4.5h6V7" /><path d="M6 7l1 13h10l1-13" /><path d="M10 11v6M14 11v6" /></Icon>;
const RotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></Icon>;
const CheckCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.5 2.5L16 9.5" /></Icon>;
const X = (p) => <Icon {...p}><path d="M5 5l14 14M19 5 5 19" /></Icon>;
const Menu = (p) => <Icon {...p}><path d="M4 6h16M4 12h16M4 18h16" /></Icon>;
const ChevronRight = (p) => <Icon {...p}><path d="M9 5l7 7-7 7" /></Icon>;
const Heart = (p) => <Icon {...p}><path d="M12 20.5s-7.5-4.7-9.7-9.3C.7 7.7 2.4 4.5 5.6 4c2-.3 3.7.7 4.4 2 .7-1.3 2.4-2.3 4.4-2 3.2.5 4.9 3.7 3.3 7.2C19.5 15.8 12 20.5 12 20.5Z" /></Icon>;
const Building = (p) => <Icon {...p}><rect x="5" y="3" width="14" height="18" rx="1" /><path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M9 15h1.5M13.5 15H15" /><path d="M10.5 21v-3h3v3" /></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" /><circle cx="12" cy="9.5" r="2.3" /></Icon>;
const Send = (p) => <Icon {...p}><path d="M4 11l16-7-6.5 16-2.8-6.7L4 11Z" /></Icon>;
const LogOut = (p) => <Icon {...p}><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9" /><path d="M14 16l4-4-4-4" /><path d="M18 12H9" /></Icon>;
const RefreshCw = (p) => <Icon {...p}><path d="M4 11a8 8 0 0 1 14-4.5L21 9" /><path d="M21 4v5h-5" /><path d="M20 13a8 8 0 0 1-14 4.5L3 15" /><path d="M3 20v-5h5" /></Icon>;
const Sparkles = (p) => <Icon {...p}><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6Z" /><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7Z" /></Icon>;
const PlusCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M12 8v8M8 12h8" /></Icon>;

const LogoCGE = ({ className = "w-10 h-10" }) => (
  <svg className={className} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 25 C100 25 118 60 118 90 C118 105 110 115 100 120 C90 115 82 105 82 90 C82 60 100 25 100 25 Z" fill="#EA580C" opacity="0.15"/>
    <path d="M100 15 C100 15 122 55 122 90 C122 110 112 122 100 128 C88 122 78 110 78 90 C78 55 100 15 100 15 Z" stroke="#EA580C" strokeWidth="6" strokeLinejoin="round"/>
    <path d="M100 25 L100 120 M85 45 Q100 55 115 45 M83 65 Q100 75 117 65 M82 85 Q100 95 118 85" stroke="#EA580C" strokeWidth="4" strokeLinecap="round"/>
    <path d="M100 35 L50 75 L150 75 Z" stroke="#EA580C" strokeWidth="5" fill="none"/>
    <circle cx="100" cy="115" r="70" stroke="#EA580C" strokeWidth="10" strokeDasharray="18 10" fill="none"/>
    <path d="M 35 120 Q 100 145 165 120 L 160 140 Q 100 165 40 140 Z" fill="#EA580C"/>
    <text x="100" y="137" textAnchor="middle" fill="#FDFBF6" fontFamily="Inter, sans-serif" fontWeight="800" fontSize="18" letterSpacing="2">ARSTM</text>
    <text x="60" y="90" textAnchor="middle" fill="#EA580C" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="22">C</text>
    <text x="140" y="90" textAnchor="middle" fill="#EA580C" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="22">G</text>
    <text x="100" y="180" textAnchor="middle" fill="#EA580C" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="22">E</text>
  </svg>
);

const SITE_SALT = "cge-arstm-2026";
const hashSecret = async (id, secret) => {
  const data = new TextEncoder().encode(`${SITE_SALT}|${id}|${secret}`);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
};
const genPin = () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 9000 + 1000);
const ADMIN_ACCOUNTS = [
  { login: "ARSTM-BUR-07", name: "Administrateur principal", hash: "2b0222a77e574b9886a0a6501d76ab71ecd228dfac0e74e2f7a4e8f15e4488df" },
  { login: "ARSTM-BUR-12", name: "Administrateur adjoint", hash: "f68af661f19d260c6173cb44acbe4485d42d394d72ca695e485d82ad8a1d250d" }
];

const initialMembers = [
  { id: 1, matricule: "2026-ARSTM-01", pinHash: "6291f028f1dd63958e289eb48a812be5a997958f97775d80c2ef24b2c8f9185a", name: "KALOGA Mouhammad Islâm", role: "Président Général", bio: "Élève ingénieur en électromécanique navale.", image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400", isDeleted: false, deletedAt: null },
  { id: 2, matricule: "2026-ARSTM-02", pinHash: "ff4a96663bbafdc1b833c95963ed7a158b5e9fefaa722e6b63f079bd7a706a62", name: "DOSSO Salimata", role: "Vice-Présidente", bio: "Étudiante en Gestion Logistique & Transport.", image: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400", isDeleted: false, deletedAt: null },
  { id: 3, matricule: "2026-ARSTM-03", pinHash: "d71efcad41a0e418c44cb8d544de1e5cd4f407ec33ca50a43218cc2af3d5d863", name: "KOUASSI Jean-Eric", role: "Secrétaire Général", bio: "Élève Officier Mécanicien.", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=400", isDeleted: false, deletedAt: null },
];

function App() {
  const [activeTab, setActiveTab] = useState('accueil');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [toast, setToast] = useState(null);

  // Auth States
  const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [showMemberModal, setShowMemberModal] = useState(false);
  const [memberMatriculeInput, setMemberMatriculeInput] = useState('');
  const [memberPinInput, setMemberPinInput] = useState('');

  // Stores
  const [members, setMembers] = useState(initialMembers);
  const [showCorbeille, setShowCorbeille] = useState(false);
  const [news, setNews] = useState([
    { id: 1, title: "Lancement du Portail Numérique & Annuaire CGE", date: "24 Septembre 2026", likes: 42, content: "Inauguration officielle du nouveau portail interactif réuni à l'ARSTM.", isDeleted: false, deletedAt: null }
  ]);
  const [alumni, setAlumni] = useState([
    { id: 1, name: "KOUAME Jean-Philippe", promo: "2023", role: "Second Officière Mécanicien", company: "Bourbon Offshore", matricule: "2023-ARSTM-89", isDeleted: false, deletedAt: null }
  ]);

  // Form Inputs
  const [newMemberForm, setNewMemberForm] = useState({ name: '', role: '', matricule: '', bio: '', image: '' });
  const [searchTerm, setSearchTerm] = useState('');
  const [confirmModal, setConfirmModal] = useState(null);

  const showToastMsg = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3500);
  };

  // --- PURGE AUTOMATIQUE DE LA CORBEILLE (30 JOURS) ---
  useEffect(() => {
    const PURGE_DELAY = 30 * 24 * 60 * 60 * 1000; // 30 jours en millisecondes
    const now = Date.now();

    const purger = (list) => list.filter(item => {
      if (!item.isDeleted || !item.deletedAt) return true;
      const age = now - new Date(item.deletedAt).getTime();
      return age < PURGE_DELAY; // Conserver seulement si < 30 jours
    });

    setMembers(prev => purger(prev));
    setNews(prev => purger(prev));
    setAlumni(prev => purger(prev));
  }, []);

  // FERMETURE MODAL PAR CLIC EXTÉRIEUR OU TOUCHE ÉCHAP
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') setConfirmModal(null);
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);

  // --- IMPORTATION CSV DES MEMBRES ---
  const handleImportCSV = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async (event) => {
      const lines = event.target.result.split('\n');
      const newMembers = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const [name, role, matricule, bio] = lines[i].split(',').map(s => s?.trim().replace(/^"|"$/g, ''));
        if (name && role) {
          const mat = matricule || `2026-ARSTM-CSV${i}`;
          const pin = genPin();
          const pinHash = await hashSecret(mat, pin);
          newMembers.push({
            id: Date.now() + i,
            name,
            role,
            matricule: mat,
            bio: bio || "Membre importé via CSV",
            image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400",
            pinHash,
            isDeleted: false,
            deletedAt: null
          });
        }
      }

      setMembers(prev => [...prev, ...newMembers]);
      showToastMsg(`${newMembers.length} membre(s) importé(s) depuis le CSV !`);
    };
    reader.readAsText(file);
  };

  const handleMemberLogin = async (e) => {
    e.preventDefault();
    const rawId = memberMatriculeInput.trim();
    const secret = memberPinInput.trim();
    const isAdminAttempt = /admin$/i.test(rawId);
    const id = isAdminAttempt ? rawId.replace(/admin$/i, '').trim() : rawId;
    
    if (isAdminAttempt) {
      const acc = ADMIN_ACCOUNTS.find(a => a.login.toLowerCase() === id.toLowerCase());
      const hash = await hashSecret(acc ? acc.login : id, secret);
      if (acc && hash === acc.hash) {
        setIsAdminLoggedIn(true);
        setCurrentUser({ id: acc.login, name: acc.name, matricule: acc.login });
        setShowMemberModal(false);
        showToastMsg("Connexion Administrateur réussie !");
        setActiveTab('admin-panel');
      } else {
        showToastMsg("Identifiant ou mot de passe Administrateur incorrect.");
      }
    } else {
      const m = members.find(x => x.matricule === id && !x.isDeleted);
      const hash = await hashSecret(m ? m.matricule : id, secret);
      if (m && hash === m.pinHash) {
        setCurrentUser(m);
        setShowMemberModal(false);
        showToastMsg(`Bienvenue, ${m.name} !`);
      } else {
        showToastMsg("Matricule ou PIN incorrect.");
      }
    }
  };

  const calculJoursRestants = (deletedAt) => {
    if (!deletedAt) return 30;
    const purgeDate = new Date(new Date(deletedAt).getTime() + 30 * 24 * 60 * 60 * 1000);
    const diffDays = Math.ceil((purgeDate - new Date()) / (1000 * 60 * 60 * 24));
    return diffDays > 0 ? diffDays : 0;
  };

  return (
    <div className="min-h-screen flex flex-col bg-[#FDFBF6] text-stone-800 font-sans">
      
      {/* Toast Notification */}
      {toast && (
        <div className="fixed bottom-6 right-6 z-50 bg-stone-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-stone-700 animate-bounce">
          <CheckCircle className="text-orange-500 w-5 h-5 flex-shrink-0" />
          <span className="text-sm font-medium">{toast}</span>
        </div>
      )}

      {/* Modal de Confirmation Sécurisé */}
      {confirmModal && (
        <div 
          onClick={() => setConfirmModal(null)}
          className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn"
        >
          <div 
            onClick={(e) => e.stopPropagation()} 
            className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-stone-200"
          >
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-lg">
                ⚠️
              </div>
              <h3 className="font-serif text-xl font-bold text-stone-900">{confirmModal.title}</h3>
            </div>
            <p className="text-sm text-stone-600 leading-relaxed">{confirmModal.message}</p>
            <div className="flex justify-end gap-3 pt-2">
              <button
                onClick={() => setConfirmModal(null)}
                className="px-4 py-2 rounded-xl text-stone-600 bg-stone-100 hover:bg-stone-200 text-sm font-semibold transition"
              >
                Annuler
              </button>
              <button
                onClick={() => {
                  confirmModal.onConfirm();
                  setConfirmModal(null);
                }}
                className="px-4 py-2 rounded-xl bg-orange-600 text-white hover:bg-orange-500 text-sm font-semibold transition"
              >
                Confirmer
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <header className="sticky top-0 z-40 bg-[#FDFBF6]/90 backdrop-blur-md border-b border-stone-200/80">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
          
          <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('accueil')}>
            <LogoCGE className="w-12 h-12" />
            <div>
              <h1 className="font-serif font-bold text-xl text-stone-900">CGE ARSTM</h1>
              <p className="text-xs text-stone-500 font-medium hidden sm:block">Conférence des Grandes Écoles</p>
            </div>
          </div>

          <nav className="hidden lg:flex items-center gap-1 bg-stone-100 p-1.5 rounded-2xl">
            {[
              { id: 'accueil', label: 'Accueil', icon: Home },
              { id: 'bureau', label: 'Bureau & Membres', icon: Users },
              { id: 'alumni', label: 'Alumni', icon: GraduationCap },
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setActiveTab(item.id)}
                className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium transition ${
                  activeTab === item.id ? 'bg-white text-orange-600 shadow-sm font-semibold' : 'text-stone-600 hover:bg-white/50'
                }`}
              >
                <item.icon className="w-4 h-4" />
                {item.label}
              </button>
            ))}
          </nav>

          <div className="flex items-center gap-3">
            {currentUser ? (
              <button
                onClick={() => setActiveTab('admin-panel')}
                className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-orange-100 text-orange-800 text-sm font-semibold"
              >
                <UserCheck className="w-4 h-4 text-orange-600" />
                <span>{currentUser.name.split(' ')[0]}</span>
              </button>
            ) : (
              <button
                onClick={() => setShowMemberModal(true)}
                className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold bg-white text-stone-800 border border-stone-200 shadow-sm hover:bg-stone-50 transition"
              >
                <Key className="w-4 h-4 text-orange-600" />
                <span>Espace Membre</span>
              </button>
            )}
          </div>
        </div>
      </header>

      {/* Main Content */}
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        {/* BUREAU VIEW */}
        {activeTab === 'bureau' && (
          <div className="space-y-8">
            <div className="flex justify-between items-center flex-wrap gap-4">
              <div>
                <h2 className="font-serif text-3xl font-bold text-stone-900">Bureau Executif & Membres</h2>
                <p className="text-stone-500">Membres inscrits au bureau exécutif de la CGE</p>
              </div>

              {isAdminLoggedIn && (
                <div className="flex items-center gap-3">
                  {/* Bouton Importation CSV */}
                  <label className="cursor-pointer inline-flex items-center gap-2 px-4 py-2 bg-stone-900 text-white rounded-xl text-sm font-semibold hover:bg-stone-800 transition">
                    <Upload className="w-4 h-4" />
                    Importer CSV
                    <input type="file" accept=".csv" onChange={handleImportCSV} className="hidden" />
                  </label>

                  {/* Bouton Bascule Corbeille */}
                  <button
                    onClick={() => setShowCorbeille(!showCorbeille)}
                    className="inline-flex items-center gap-2 px-4 py-2 bg-orange-100 text-orange-800 rounded-xl text-sm font-semibold hover:bg-orange-200 transition"
                  >
                    <Trash2 className="w-4 h-4" />
                    {showCorbeille ? 'Voir Membres Actifs' : `Corbeille (${members.filter(m => m.isDeleted).length})`}
                  </button>
                </div>
              )}
            </div>

            {/* VUE CORBEILLE */}
            {showCorbeille ? (
              <div className="bg-orange-50 border border-orange-200 p-6 rounded-3xl space-y-4">
                <h3 className="font-serif text-xl font-bold text-orange-900">
                  Corbeille (Purge automatique après 30 jours)
                </h3>
                {members.filter(m => m.isDeleted).length === 0 ? (
                  <p className="text-stone-500 text-sm">La corbeille est actuellement vide.</p>
                ) : (
                  <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {members.filter(m => m.isDeleted).map(m => (
                      <div key={m.id} className="bg-white p-4 rounded-2xl border border-stone-200 flex flex-col justify-between space-y-3">
                        <div>
                          <h4 className="font-bold text-stone-900">{m.name}</h4>
                          <p className="text-xs text-stone-500">{m.role}</p>
                          <span className="inline-block mt-2 text-[11px] font-bold text-rose-600 bg-rose-50 px-2.5 py-0.5 rounded-full">
                            Effacé dans {calculJoursRestants(m.deletedAt)} jour(s)
                          </span>
                        </div>
                        <div className="flex gap-2 pt-2 border-t border-stone-100">
                          <button
                            onClick={() => {
                              setMembers(members.map(x => x.id === m.id ? { ...x, isDeleted: false, deletedAt: null } : x));
                              showToastMsg(`${m.name} a été restauré.`);
                            }}
                            className="flex-1 py-1.5 bg-emerald-600 text-white text-xs font-semibold rounded-lg hover:bg-emerald-500 transition flex items-center justify-center gap-1"
                          >
                            <RotateCcw className="w-3.5 h-3.5" /> Restaurer
                          </button>
                          <button
                            onClick={() => {
                              setConfirmModal({
                                title: "Suppression définitive",
                                message: `Supprimer définitivement ${m.name} ? Cette action ne pourra pas être annulée.`,
                                onConfirm: () => {
                                  setMembers(members.filter(x => x.id !== m.id));
                                  showToastMsg("Membre supprimé définitivement.");
                                }
                              });
                            }}
                            className="p-1.5 bg-rose-100 text-rose-600 rounded-lg hover:bg-rose-200 transition"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              /* VUE MEMBRES ACTIFS */
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {members.filter(m => !m.isDeleted).map(m => (
                  <div key={m.id} className="bg-white rounded-3xl overflow-hidden border border-stone-200 shadow-sm flex flex-col relative">
                    {isAdminLoggedIn && (
                      <button
                        onClick={() => {
                          setConfirmModal({
                            title: "Mettre à la corbeille",
                            message: `Déplacer ${m.name} vers la corbeille ? Il y sera conservé pendant 30 jours.`,
                            onConfirm: () => {
                              setMembers(members.map(x => x.id === m.id ? { ...x, isDeleted: true, deletedAt: new Date().toISOString() } : x));
                              showToastMsg(`${m.name} déplacé dans la corbeille.`);
                            }
                          });
                        }}
                        className="absolute top-3 right-3 z-10 p-2 bg-white/80 backdrop-blur-md text-rose-600 hover:bg-rose-600 hover:text-white rounded-xl transition shadow-md"
                        title="Mettre à la corbeille"
                      >
                        <Trash2 className="w-5 h-5" />
                      </button>
                    )}
                    <img src={m.image} alt={m.name} className="w-full h-56 object-cover" />
                    <div className="p-6 flex-1 flex flex-col justify-between space-y-4">
                      <div>
                        <span className="text-xs font-bold uppercase text-orange-600 bg-orange-50 px-3 py-1 rounded-full inline-block mb-2">
                          {m.role}
                        </span>
                        <h3 className="font-serif text-xl font-bold text-stone-900">{m.name}</h3>
                        <p className="text-stone-600 text-sm mt-2">{m.bio}</p>
                      </div>
                      <div className="pt-2 border-t border-stone-100 text-xs text-stone-400">
                        Matricule : {m.matricule}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ACCUEIL VIEW */}
        {activeTab === 'accueil' && (
          <div className="space-y-12">
            <div className="rounded-3xl bg-stone-900 text-white p-12 shadow-2xl space-y-6">
              <span className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-orange-500/20 text-orange-400 border border-orange-500/30 text-xs font-semibold uppercase">
                <Sparkles className="w-3.5 h-3.5" /> ARSTM Abidjan
              </span>
              <h2 className="font-serif text-4xl font-bold">Portail Officiel CGE ARSTM</h2>
              <p className="text-stone-300 max-w-2xl leading-relaxed">
                Retrouvez l'annuaire complet, les offres d'emplois, les opportunités de stages et la gestion sécurisée du bureau exécutif.
              </p>
              <button
                onClick={() => setActiveTab('bureau')}
                className="px-6 py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-semibold transition"
              >
                Consulter le Bureau
              </button>
            </div>
          </div>
        )}

      </main>

      {/* Modal Connexion */}
      {showMemberModal && (
        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-8 space-y-6 border border-stone-200 shadow-2xl">
            <div className="text-center space-y-2">
              <LogoCGE className="w-14 h-14 mx-auto" />
              <h3 className="font-serif text-2xl font-bold text-stone-900">Espace Membre</h3>
            </div>
            <form onSubmit={handleMemberLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">Matricule</label>
                <input
                  type="text"
                  placeholder="Ex: 2026-ARSTM-01 ou ARSTM-BUR-07admin"
                  value={memberMatriculeInput}
                  onChange={(e) => setMemberMatriculeInput(e.target.value)}
                  className="w-full px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">Code PIN</label>
                <input
                  type="password"
                  placeholder="Votre code PIN"
                  value={memberPinInput}
                  onChange={(e) => setMemberPinInput(e.target.value)}
                  className="w-full px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
              </div>
              <div className="flex gap-3 pt-2">
                <button
                  type="button"
                  onClick={() => setShowMemberModal(false)}
                  className="flex-1 py-3 rounded-xl bg-stone-100 text-stone-700 font-semibold hover:bg-stone-200 text-sm"
                >
                  Annuler
                </button>
                <button
                  type="submit"
                  className="flex-1 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-500 text-sm"
                >
                  Connexion
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* Footer */}
      <footer className="bg-stone-900 text-white border-t border-stone-800 py-8 mt-16">
        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-stone-500">
          &copy; 2026 CGE ARSTM. Tous droits réservés.
        </div>
      </footer>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
