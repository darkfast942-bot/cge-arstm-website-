  const data = new TextEncoder().encode(`${SITE_SALT}|${id}|${secret}`);

};

const MediaStore = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("cge-arstm-media", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async all() {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = db.transaction("photos").objectStore("photos").getAll();
      q.onsuccess = () => res(q.result.sort((a, b) => b.ts - a.ts));
      q.onerror = () => rej(q.error);
    });
  },
  async add(item) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("photos", "readwrite");
      t.objectStore("photos").put(item);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  },
  async remove(id) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("photos", "readwrite");
      t.objectStore("photos").delete(id);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  }
};

const fileToDataUrl = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onerror = () => reject(reader.error);
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("image"));
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

      else showToastMsg("Aucune image valide sélectionnée.");
    } catch (err) {
      showToastMsg("Échec de l'ajout de la photo.");
    }
    setUploading(false);
    return added;
  };

  const handleMemberLogin = async (e) => {
    e.preventDefault();
    if (Date.now() < lockUntil) {
      showToastMsg(`Trop de tentatives. Réessayez dans ${Math.ceil((lockUntil - Date.now()) / 1000)} secondes.`);
      return;
    }
    const rawId = memberMatriculeInput.trim();
    const secret = memberPinInput.trim();

    const isAdminAttempt = /admin$/i.test(rawId);
    const id = isAdminAttempt ? rawId.replace(/admin$/i, '').trim() : rawId;
    let result = null;
    try {
      if (isAdminAttempt) {
        const acc = ADMIN_ACCOUNTS.find(a => a.login.toLowerCase() === id.toLowerCase());
        const hash = await hashSecret(acc ? acc.login : id, secret);
        if (acc && hash === acc.hash) result = { admin: true, user: { id: acc.login, name: acc.name, matricule: acc.login } };
      } else {
        const m = members.find(x => x.matricule === id);
        const hash = await hashSecret(m ? m.matricule : id, secret);
        if (m && hash === m.pinHash) result = { admin: false, user: m };
      }
    } catch (err) {
      showToastMsg("Connexion impossible : ouvrez le portail via son lien https sécurisé.");
      return;
    }
    if (result) {
      setFailedAttempts(0);
      setCurrentUser(result.user);
      setIsAdminLoggedIn(result.admin);
      setShowMemberModal(false);
      setMemberMatriculeInput('');
      setMemberPinInput('');
      if (result.admin) {
        showToastMsg("Bienvenue Administrateur !");
        setActiveTab('admin-panel');
      } else {
        showToastMsg(`Bienvenue dans votre espace, ${result.user.name} !`);
      }
    } else {
      const n = failedAttempts + 1;
      if (n >= 5) {
        setLockUntil(Date.now() + 60000);
        setFailedAttempts(0);
        showToastMsg("Trop de tentatives échouées. Connexion bloquée pendant 1 minute.");
      } else {
        setFailedAttempts(n);
        showToastMsg("Identifiant ou code incorrect.");
      }
    }
  };

                </div>
                <h3 className="font-bold text-stone-900">Contacts Électroniques</h3>
                <p className="text-sm text-stone-600 leading-relaxed">
                  cge@arstm.ci<br />
                  bureau.cge@arstm-ci.org
                </p>
              </div>
            </div>
          </div>
        )}

        {/* MEMBER DASHBOARD VIEW */}
        {activeTab === 'espace-membre' && currentUser && (
          <div className="max-w-3xl mx-auto space-y-8">
            <div className="flex justify-between items-center">
              <div>
                <h2 className="font-serif text-3xl font-bold text-stone-900">
                  {isAdminLoggedIn ? "Zone Administrateur" : "Espace Membre Officiel"}
                </h2>
                <p className="text-stone-500">Gestion de votre carte numérique et paramètres de sécurité</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setActiveTab('accueil')}
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-orange-50 text-orange-700 border border-orange-200 text-sm font-semibold hover:bg-orange-100 transition"
                >
                  <Home className="w-4 h-4" />
                  Retour à l'accueil
                </button>
                <button
                  onClick={() => {
                    setCurrentUser(null);
                    setIsAdminLoggedIn(false);
                    setActiveTab('accueil');
                    showToastMsg("Déconnexion réussie.");
                  }}
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-stone-200 text-stone-700 text-sm font-semibold hover:bg-stone-300 transition"
                >
                  <LogOut className="w-4 h-4" />
                  Déconnexion
                </button>
              </div>
            </div>

            {/* Student / Admin ID Card Badge */}
            <div className="bg-gradient-to-br from-stone-900 via-stone-800 to-stone-900 text-white rounded-3xl p-8 shadow-2xl relative overflow-hidden border border-stone-700">
              <div className="absolute top-0 right-0 p-8 opacity-10">
                <LogoCGE className="w-64 h-64" />
              </div>
              <div className="relative z-10 flex flex-col sm:flex-row items-center sm:items-start gap-6">
                <img src={currentUser.image} alt={currentUser.name} className="w-28 h-28 rounded-2xl object-cover border-2 border-orange-500 shadow-md" />
                <div className="space-y-2 text-center sm:text-left">
                  <span className="text-xs font-bold bg-orange-500/20 text-orange-400 border border-orange-500/30 px-3 py-1 rounded-full uppercase tracking-wider">
                    {isAdminLoggedIn ? "Compte Administrateur" : "Carte d'Étudiant Membre"}
                  </span>
                  <h3 className="font-serif text-2xl font-bold">
                    {isAdminLoggedIn ? "Administrateur" : currentUser.name}
                  </h3>
                  <p className="text-orange-400 font-semibold text-sm">{currentUser.role}</p>
                  <p className="text-xs text-stone-400 font-mono pt-2">Matricule : {currentUser.matricule}</p>
                </div>
              </div>
            </div>

            {/* Change PIN Code Form */}
            {!isAdminLoggedIn && (
            <div className="bg-white p-8 rounded-3xl border border-stone-200 shadow-sm space-y-6">
              <h3 className="font-serif text-xl font-bold text-stone-900 flex items-center gap-2">
                <Key className="w-5 h-5 text-orange-600" />
                Modifier mon code PIN d'accès
              </h3>
              <div className="flex flex-col sm:flex-row gap-4">
                <input
                  type="password"
                  placeholder="Nouveau code PIN (4 à 6 chiffres)"
                  inputMode="numeric"
                  maxLength={6}
                  value={newPinInput}
                  onChange={(e) => setNewPinInput(e.target.value)}
                  className="flex-1 px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 text-stone-900 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                <button
                  onClick={handleUpdatePin}
                  className="px-6 py-3 bg-orange-600 text-white font-semibold rounded-2xl hover:bg-orange-500 transition"
                >
                  Mettre à jour le PIN
                </button>
              </div>
            </div>
            )}
          </div>
        )}

        {/* ADMIN PANEL VIEW */}
        {activeTab === 'admin-panel' && isAdminLoggedIn && (
          <div className="space-y-8">
            <div className="flex justify-between items-center">
              <div>
                <h2 className="font-serif text-3xl font-bold text-stone-900">Panneau d'Administration CGE</h2>
                <p className="text-stone-500">Gestion globale des membres, des suggestions et de l'annuaire</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setActiveTab('accueil')}
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-orange-50 text-orange-700 border border-orange-200 text-sm font-semibold hover:bg-orange-100 transition"
                >
                  <Home className="w-4 h-4" />
                  Retour à l'accueil
                </button>
                <button
                  onClick={() => {
                    setIsAdminLoggedIn(false);
                    setCurrentUser(null);
                    setActiveTab('accueil');
                    showToastMsg("Session d'administration fermée.");
                  }}
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-stone-200 text-stone-700 text-sm font-semibold hover:bg-stone-300 transition"
                >
                  <LogOut className="w-4 h-4" />
                  Quitter Session Admin
                </button>
              </div>
            </div>

            <div className="grid md:grid-cols-2 gap-8">
              {/* Member Reset PIN Section */}
              <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm space-y-4">
                <h3 className="font-serif text-xl font-bold text-stone-900 flex items-center gap-2">
                  <RefreshCw className="w-5 h-5 text-orange-600" />
                  Réinitialiser le Code PIN d'un membre
                </h3>
                <p className="text-xs text-stone-500">Génère un nouveau code PIN temporaire aléatoire en cas d'oubli.</p>
                <div className="space-y-3">
                  {members.map(m => (
                    <div key={m.id} className="flex justify-between items-center p-3 rounded-2xl bg-stone-50 border border-stone-200">
                      <div>
                        <p className="text-sm font-bold text-stone-800">{m.name}</p>
                        <p className="text-xs text-stone-400">{m.matricule}</p>
                      </div>
                      <button
                        onClick={() => {
                          setConfirmModal({
                            title: "Réinitialiser le code PIN",
                            message: `Générer un nouveau code PIN temporaire pour ${m.name} ?`,
                            onConfirm: async () => {
                              const pin = genPin();
                              const pinHash = await hashSecret(m.matricule, pin);
                              
                              if (supabaseClient) {
                                await supabaseClient.from('members').update({ pinHash }).eq('id', m.id);
                              }

                              setMembers(prev => prev.map(item => item.id === m.id ? { ...item, pinHash } : item));
                              setTempPinInfo({ name: m.name, pin });
                            }
                          });
                        }}
                        className="px-3 py-1.5 bg-stone-200 text-stone-800 rounded-xl text-xs font-semibold hover:bg-orange-100 hover:text-orange-700 transition"
                      >
                        Réinitialiser PIN
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Suggestions Admin View */}
              <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-serif text-xl font-bold text-stone-900 flex items-center gap-2">
                    <MessageSquare className="w-5 h-5 text-purple-600" />
                    Suggestions anonymes ({suggestions.length})
                  </h3>
                  <button
                    onClick={() => exportCSV(suggestions, 'suggestions_anonymes_cge')}
                    className="text-xs text-orange-600 font-semibold hover:underline"
                  >
                    Exporter CSV
                  </button>
                </div>
                <div className="space-y-3 max-h-80 overflow-y-auto">
                  {suggestions.map(s => (
                    <div key={s.id} className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-2 relative group">
                      <div className="flex justify-between text-xs text-stone-400">
                        <span>{s.date}</span>
                        <button
                          onClick={() => {
                            setConfirmModal({
                              title: "Supprimer la suggestion",
                              message: "Êtes-vous sûr de vouloir effacer cette suggestion ?",
                              onConfirm: async () => {
                                if (supabaseClient) {
                                  await supabaseClient.from('suggestions').delete().eq('id', s.id);
                                }
                                setSuggestions(suggestions.filter(item => item.id !== s.id));
                                showToastMsg("Suggestion supprimée.");
                              }
                            });
                          }}
                          className="text-rose-500 hover:text-rose-700"
                        >
                          <Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                      <p className="text-sm text-stone-800 font-medium">{s.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Admin photo storage */}
            <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h3 className="font-serif text-xl font-bold text-stone-900 flex items-center gap-2">
                    <ImgIcon className="w-5 h-5 text-orange-600" />
                    Espace de stockage photos (admins)
                  </h3>
                  <p className="text-xs text-stone-500">Ajoutez vos photos ici une seule fois, puis choisissez-les avec le bouton « Mes photos » dans les formulaires.</p>
                </div>
                <label className="cursor-pointer px-4 py-2.5 bg-orange-600 text-white rounded-xl text-sm font-semibold hover:bg-orange-500 transition">
                  {uploading ? "Envoi..." : "Ajouter des photos"}
                  <input type="file" accept="image/*" multiple className="hidden" onChange={(e) => { uploadPhotos(e.target.files); e.target.value = ''; }} />
                </label>
              </div>
              {photos.length === 0 ? (
                <p className="text-sm text-stone-400 py-6 text-center">Aucune photo pour le moment.</p>
              ) : (
                <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
                  {photos.map(p => (
                    <div key={p.id} className="relative group rounded-xl overflow-hidden border border-stone-200">
                      <img src={p.data} alt={p.name} className="w-full h-24 object-cover" />
                      <button
                        onClick={() => setConfirmModal({
                          title: "Supprimer la photo",
                          message: `Retirer « ${p.name} » de l'espace de stockage ?`,
                          onConfirm: async () => { await MediaStore.remove(p.id); setPhotos(prev => prev.filter(x => x.id !== p.id)); showToastMsg("Photo supprimée."); }
                        })}
                        className="absolute top-1 right-1 p-1.5 bg-white/90 text-rose-600 rounded-lg shadow hover:bg-rose-600 hover:text-white transition"
                        title="Supprimer"
                      >
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <p className="text-[11px] text-stone-400">Ces photos sont enregistrées sur cet appareil et visibles uniquement après connexion admin.</p>
            </div>
          </div>
        )}

      </main>

      {/* Login Modal */}
      {showMemberModal && (
        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-8 space-y-6 border border-stone-200 shadow-2xl">
            <div className="text-center space-y-2">
              <LogoCGE className="w-14 h-14 mx-auto" />
              <h3 className="font-serif text-2xl font-bold text-stone-900">Espace Membre Etudiant</h3>
              <p className="text-xs text-stone-500">Connectez-vous à l'aide de votre Matricule et Code PIN</p>
            </div>

            <form onSubmit={handleMemberLogin} className="space-y-4" autoComplete="off">
              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">Matricule Unique</label>
                <input
                  type="text"
                  placeholder="Ex: 2026-ARSTM-01"
                  value={memberMatriculeInput}
                  onChange={(e) => setMemberMatriculeInput(e.target.value)}
                  className="w-full px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 text-stone-900 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">Code PIN</label>
                <input
                  type="password"
                  placeholder="Votre code PIN"
                  value={memberPinInput}
                  onChange={(e) => setMemberPinInput(e.target.value)}
                  className="w-full px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 text-stone-900 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
              </div>

              <div className="flex gap-3 pt-2">
                <button
                  type="button"
                  onClick={() => setShowMemberModal(false)}
                  className="flex-1 py-3 rounded-xl bg-stone-100 text-stone-700 font-semibold hover:bg-stone-200 transition text-sm"
                >
                  Annuler
                </button>
                <button
                  type="submit"
                  className="flex-1 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-500 transition text-sm shadow-md shadow-orange-600/20"
                >
                  Connexion
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* Temporary PIN Modal */}
      {tempPinInfo && (
        <div className="fixed inset-0 z-[60] bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-8 space-y-5 border border-stone-200 shadow-2xl text-center">
            <Key className="w-8 h-8 mx-auto text-orange-600" />
            <h3 className="font-serif text-xl font-bold text-stone-900">Code PIN temporaire</h3>
            <p className="text-sm text-stone-600">Code de <strong>{tempPinInfo.name}</strong> :</p>
            <p className="text-4xl font-mono font-bold tracking-widest text-stone-900">{tempPinInfo.pin}</p>
            <p className="text-xs text-stone-500">Notez-le maintenant et donnez-le au membre en main propre. Il ne sera plus jamais affiché. Le membre doit le changer dès sa première connexion.</p>
            <button
              onClick={() => setTempPinInfo(null)}
              className="w-full py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-500 transition text-sm"
            >
              J'ai noté le code
            </button>
          </div>
        </div>
      )}

      {/* Photo picker modal */}
      {picker && isAdminLoggedIn && (
        <div className="fixed inset-0 z-[55] bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col border border-stone-200 shadow-2xl">
            <div className="p-6 flex items-center justify-between gap-3 border-b border-stone-100">
              <h3 className="font-serif text-xl font-bold text-stone-900">Choisir une photo</h3>
              <div className="flex items-center gap-2">
                <label className="cursor-pointer px-4 py-2 bg-orange-600 text-white rounded-xl text-xs font-semibold hover:bg-orange-500 transition">
                  {uploading ? "Envoi..." : "Depuis mon appareil"}
                  <input type="file" accept="image/*" className="hidden" onChange={async (e) => {
                    const added = await uploadPhotos(e.target.files);
                    e.target.value = '';
                    if (added.length === 1) { picker.onPick(added[0].data); setPicker(null); }
                  }} />
                </label>
                <button onClick={() => setPicker(null)} className="p-2 rounded-xl bg-stone-100 text-stone-600 hover:bg-stone-200"><X className="w-4 h-4" /></button>
              </div>
            </div>
            <div className="p-6 overflow-y-auto">
              {photos.length === 0 ? (
                <p className="text-sm text-stone-400 text-center py-10">Aucune photo. Utilisez « Depuis mon appareil » pour en ajouter.</p>
              ) : (
                <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                  {photos.map(p => (
                    <button key={p.id} onClick={() => { picker.onPick(p.data); setPicker(null); }} className="rounded-xl overflow-hidden border-2 border-transparent hover:border-orange-500 transition">
                      <img src={p.data} alt={p.name} className="w-full h-24 object-cover" />
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Footer */}
      <footer className="bg-stone-900 text-white border-t border-stone-800 py-12 mt-16">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
          <div className="flex items-center gap-3">
            <LogoCGE className="w-10 h-10" />
            <div>
              <h4 className="font-serif font-bold text-lg">Conférence des Grandes Écoles</h4>
              <p className="text-xs text-stone-400">Académie Régionale des Sciences et Techniques de la Mer</p>
            </div>
          </div>
          <p className="text-xs text-stone-500">
            &copy; 2026 CGE ARSTM. Tous droits réservés.
          </p>
        </div>
      </footer>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
