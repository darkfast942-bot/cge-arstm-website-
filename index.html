const SITE_SALT = "cge-arstm-2026";
const hashSecret = async (id, secret) => {
  const data = new TextEncoder().encode(`${SITE_SALT}|${id}|${secret}`);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
};

function App() {
  const [activeTab, setActiveTab] = useState('accueil');
  const [hoveredTab, setHoveredTab] = useState(null);
  const [toast, setToast] = useState(null);

  // Auth States
  const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [showMemberModal, setShowMemberModal] = useState(false);
  const [memberMatriculeInput, setMemberMatriculeInput] = useState('');
  const [memberPinInput, setMemberPinInput] = useState('');
  const [failedAttempts, setFailedAttempts] = useState(0);
  const [lockUntil, setLockUntil] = useState(0);
  const [isCheckingLogin, setIsCheckingLogin] = useState(false);

  // Pillar animation positioning ref
  const navRef = useRef(null);
  const [pillStyle, setPillStyle] = useState({ left: 0, width: 0, opacity: 0 });

  // Data Stores
  const [members, setMembers] = useState(initialMembers);
  const [news, setNews] = useState(initialNews);
  const [jobs, setJobs] = useState(initialJobs);
  const [alumni, setAlumni] = useState(initialAlumni);
  const [gallery, setGallery] = useState(initialGallery);

  // Génération dynamique des éléments de navigation selon le statut de connexion
  const isUserAuthenticated = currentUser !== null || isAdminLoggedIn;

  const baseNavItems = [
    { id: 'accueil', label: 'Accueil', icon: Home },
    { id: 'bureau', label: 'Membres', icon: Users },
    { id: 'emplois', label: 'Emplois & Stages', icon: Briefcase, protected: true },
    { id: 'activites', label: 'Activités', icon: Calendar },
    { id: 'alumni', label: 'Alumni', icon: GraduationCap },
    { id: 'mediatheque', label: 'Médiathèque', icon: Image },
    { id: 'contact', label: 'Contact', icon: Mail },
  ];

  // Filtrage des éléments pour n'afficher la section d'offres d'emploi qu'une fois connecté
  const navItems = baseNavItems.filter(item => !item.protected || isUserAuthenticated);

  const showToastMsg = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3500);
  };

  // Met à jour la position de la pilule suiveuse (Apple Liquid Glass Pill)
  useEffect(() => {
    const targetId = hoveredTab || activeTab;
    if (!navRef.current) return;
    const targetEl = navRef.current.querySelector(`[data-tab="${targetId}"]`);
    if (targetEl) {
      setPillStyle({
        left: targetEl.offsetLeft,
        width: targetEl.offsetWidth,
        opacity: 1
      });
    } else {
      setPillStyle(prev => ({ ...prev, opacity: 0 }));
    }
  }, [activeTab, hoveredTab, isUserAuthenticated]);

  const closeMemberModal = () => {
    setShowMemberModal(false);
    setMemberMatriculeInput('');
    setMemberPinInput('');
  };

  // Connexion (membre ou administrateur)
  const handleMemberLogin = async () => {
    if (lockUntil > Date.now()) return;
    const id = memberMatriculeInput.trim();
    const secret = memberPinInput.trim();
    if (!id || !secret) {
      showToastMsg("Veuillez renseigner l'identifiant et le code.");
      return;
    }

    setIsCheckingLogin(true);
    try {
      const admin = ADMIN_ACCOUNTS.find(a => a.login.toLowerCase() === id.toLowerCase());
      if (admin) {
        const h = await hashSecret(admin.login, secret);
        if (h === admin.hash) {
          setIsAdminLoggedIn(true);
          setCurrentUser({ name: admin.name });
          setFailedAttempts(0);
          closeMemberModal();
          showToastMsg(`Bienvenue, ${admin.name}`);
          return;
        }
      } else {
        const member = members.find(m => m.matricule.toLowerCase() === id.toLowerCase());
        if (member) {
          const h = await hashSecret(member.matricule, secret);
          if (h === member.pinHash) {
            setIsAdminLoggedIn(false);
            setCurrentUser(member);
            setFailedAttempts(0);
            closeMemberModal();
            showToastMsg(`Bienvenue, ${member.name.split(' ')[0]}`);
            return;
          }
        }
      }

      const attempts = failedAttempts + 1;
      setFailedAttempts(attempts);
      if (attempts >= 5) {
        setLockUntil(Date.now() + 30000);
        setFailedAttempts(0);
        showToastMsg("Trop de tentatives. Réessayez dans 30 secondes.");
      } else {
        showToastMsg("Identifiant ou code incorrect.");
      }
    } finally {
      setIsCheckingLogin(false);
    }
  };

  const handleLogout = () => {
    setCurrentUser(null);
    setIsAdminLoggedIn(false);
    setActiveTab('accueil');
    showToastMsg("Déconnexion réussie.");
  };

  return (
    <div className="min-h-screen flex flex-col text-stone-800 font-sans antialiased selection:bg-orange-500 selection:text-white">
      
      {/* Toast Notification */}
      {toast && (
        <div className="fixed top-6 right-6 z-50 glass-card text-stone-900 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/60 animate-bounce">
          <CheckCircle className="text-orange-600 w-5 h-5 flex-shrink-0" />
          <span className="text-sm font-semibold">{toast}</span>
        </div>
      )}

      {/* MODALE ESPACE MEMBRE */}
      {showMemberModal && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4"
          onClick={closeMemberModal}
        >
          <div
            className="glass-card w-full max-w-sm rounded-3xl p-8 space-y-5 relative"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              onClick={closeMemberModal}
              className="absolute top-5 right-5 text-stone-400 hover:text-stone-700"
              aria-label="Fermer"
            >
              <X className="w-5 h-5" />
            </button>

            <div className="space-y-1">
              <div className="w-11 h-11 rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
                <Key className="w-5 h-5 text-orange-600" />
              </div>
              <h3 className="font-serif text-xl font-bold text-stone-900 pt-2">Espace Membre</h3>
              <p className="text-xs text-stone-500">Connectez-vous pour débloquer l'accès aux offres d'emplois & stages.</p>
            </div>

            <div className="space-y-3">
              <input
                type="text"
                autoFocus
                placeholder="Matricule / Identifiant"
                value={memberMatriculeInput}
                onChange={(e) => setMemberMatriculeInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleMemberLogin()}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
              <input
                type="password"
                placeholder="Code PIN / Mot de passe"
                value={memberPinInput}
                onChange={(e) => setMemberPinInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleMemberLogin()}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>

            {lockUntil > Date.now() ? (
              <p className="text-xs font-semibold text-rose-600 text-center">Trop de tentatives, réessayez dans un instant.</p>
            ) : (
              <button
                onClick={handleMemberLogin}
                disabled={isCheckingLogin}
                className="hover-scale w-full py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 disabled:opacity-60"
              >
                {isCheckingLogin ? "Vérification..." : "Se connecter"}
              </button>
            )}
          </div>
        </div>
      )}

      {/* Header Minimaliste */}
      <header className="sticky top-0 z-30 pt-4 px-4 sm:px-8">
        <div className="max-w-7xl mx-auto glass-card rounded-3xl px-6 h-16 flex items-center justify-between">
          <div className="flex items-center gap-3 cursor-pointer group hover-scale" onClick={() => setActiveTab('accueil')}>
            <LogoCGE className="w-9 h-9 transition-transform duration-300 group-hover:rotate-6" />
            <div>
              <h1 className="font-serif font-bold text-lg text-stone-900 leading-tight">CGE ARSTM</h1>
              <p className="text-[10px] text-stone-500 font-medium tracking-wide uppercase">Conférence des Grandes Écoles</p>
            </div>
          </div>

          <div className="flex items-center gap-3">
            {currentUser ? (
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setActiveTab('espace-membre')}
                  className="hover-scale flex items-center gap-2 px-4 py-2 rounded-2xl bg-orange-500/10 text-orange-700 text-xs font-semibold border border-orange-500/20"
                >
                  <UserCheck className="w-4 h-4 text-orange-600" />
                  <span>{isAdminLoggedIn ? "Administrateur" : currentUser.name.split(' ')[0]}</span>
                </button>
              </div>
            ) : (
              <button
                onClick={() => setShowMemberModal(true)}
                className="hover-scale flex items-center gap-2 px-5 py-2 rounded-2xl text-xs font-semibold bg-stone-900 text-white shadow-lg shadow-stone-900/20 hover:bg-orange-600 transition duration-300"
              >
                <Key className="w-4 h-4 text-orange-400" />
                <span>Espace Membre</span>
              </button>
            )}
          </div>
        </div>
      </header>

      {/* Main Content */}
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        {/* HOMEPAGE VIEW */}
        {activeTab === 'accueil' && (
          <div className="space-y-12">
            <div className="relative rounded-3xl overflow-hidden glass-card p-8 sm:p-14 border border-white/80">
              <div className="relative z-10 max-w-2xl space-y-6">
                <span className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-orange-500/15 text-orange-700 border border-orange-500/30 text-xs font-semibold tracking-wide">
                  <Sparkles className="w-3.5 h-3.5 text-orange-600" /> ARSTM — Excellence Navale & Portuaire
                </span>
                <h2 className="font-serif text-3xl sm:text-5xl font-extrabold text-stone-900 leading-tight">
                  Portail Officiel de la <span className="bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent">CGE ARSTM</span>
                </h2>
                <p className="text-stone-600 text-base sm:text-lg leading-relaxed">
                  L'espace communautaire interactif dédié à la cohésion, aux opportunités de carrière et au rayonnement des élèves officiers et ingénieurs.
                </p>
                {!isUserAuthenticated && (
                  <button
                    onClick={() => setShowMemberModal(true)}
                    className="hover-scale inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 text-sm"
                  >
                    <Key className="w-4 h-4" /> Connectez-vous pour voir les opportunités
                  </button>
                )}
              </div>
            </div>

            {/* NEWS SECTION */}
            <div className="space-y-6">
              <h3 className="font-serif text-2xl font-bold text-stone-900">Dernières Actualités</h3>
              <div className="grid md:grid-cols-2 gap-6">
                {news.map(item => (
                  <div key={item.id} className="glass-card rounded-3xl p-6 hover-scale space-y-4">
                    <div className="flex justify-between items-center text-xs font-semibold">
                      <span className="bg-orange-500/10 text-orange-700 px-3 py-1 rounded-full border border-orange-500/20">{item.date}</span>
                      <span className="flex items-center gap-1 text-rose-500 font-bold"><Heart className="w-4 h-4 fill-rose-500" /> {item.likes}</span>
                    </div>
                    <h4 className="font-serif text-xl font-bold text-stone-900">{item.title}</h4>
                    <p className="text-stone-600 text-sm leading-relaxed">{item.content}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* BUREAU / MEMBRES VIEW */}
        {activeTab === 'bureau' && (
          <div className="space-y-8">
            <div>
              <h2 className="font-serif text-3xl font-bold text-stone-900">Bureau Exécutif & Membres</h2>
              <p className="text-stone-500">Représentants officiels de la Conférence des Grandes Écoles</p>
            </div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {members.map(m => (
                <div key={m.id} className="glass-card rounded-3xl overflow-hidden hover-scale flex flex-col">
                  <img src={m.image} alt={m.name} className="w-full h-56 object-cover" />
                  <div className="p-6 flex-1 flex flex-col justify-between space-y-4">
                    <div>
                      <span className="text-[10px] font-extrabold uppercase tracking-widest text-orange-600 bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full inline-block mb-2">
                        {m.role}
                      </span>
                      <h3 className="font-serif text-xl font-bold text-stone-900">{m.name}</h3>
                      <p className="text-stone-600 text-sm mt-2 leading-relaxed">{m.bio}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* EMPLOIS & STAGES VIEW (PROTECTED SECTION) */}
        {activeTab === 'emplois' && (
          isUserAuthenticated ? (
            <div className="space-y-8">
              <div>
                <h2 className="font-serif text-3xl font-bold text-stone-900">Offres d'Emplois & Stages</h2>
                <p className="text-stone-500">Espace réservé — Opportunités professionnelles maritimes et industrielles</p>
              </div>
              <div className="space-y-4">
                {jobs.map(j => (
                  <div key={j.id} className="glass-card p-6 rounded-3xl hover-scale flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div className="space-y-2">
                      <span className="text-xs font-bold text-emerald-700 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">{j.type}</span>
                      <h3 className="font-serif text-xl font-bold text-stone-900">{j.title}</h3>
                      <p className="text-sm font-semibold text-stone-600 flex items-center gap-2"><Building className="w-4 h-4 text-orange-600" /> {j.company}</p>
                      <p className="text-stone-600 text-sm">{j.desc}</p>
                    </div>
                    <button onClick={() => showToastMsg("Candidature transmise avec succès !")} className="hover-scale px-6 py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 whitespace-nowrap">
                      Postuler
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="max-w-md mx-auto glass-card p-8 rounded-3xl text-center space-y-4">
              <Key className="w-12 h-12 mx-auto text-orange-600" />
              <h3 className="font-serif text-xl font-bold">Espace Réservé</h3>
              <p className="text-stone-600 text-sm">Vous devez vous connecter à votre espace membre pour consulter les offres d'emploi et de stage.</p>
              <button onClick={() => setShowMemberModal(true)} className="hover-scale px-6 py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30">
                Se connecter
              </button>
            </div>
          )
        )}

        {/* ACTIVITES VIEW */}
        {activeTab === 'activites' && (
          <div className="space-y-8">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Activités & Projets</h2>
            <div className="glass-card p-8 rounded-3xl text-center space-y-4">
              <Calendar className="w-12 h-12 mx-auto text-orange-600" />
              <h3 className="font-serif text-xl font-bold">Calendrier des événements à venir</h3>
              <p className="text-stone-600 text-sm max-w-md mx-auto">Consultez régulièrement cette rubrique pour suivre les ateliers technologiques, séminaires et rencontres sportives.</p>
            </div>
          </div>
        )}

        {/* ALUMNI VIEW */}
        {activeTab === 'alumni' && (
          <div className="space-y-8">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Réseau Alumni</h2>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {alumni.map(a => (
                <div key={a.id} className="glass-card p-6 rounded-3xl hover-scale space-y-3">
                  <div className="flex justify-between items-start">
                    <h3 className="font-serif text-lg font-bold text-stone-900">{a.name}</h3>
                    <span className="text-xs font-bold text-orange-600 bg-orange-500/10 px-2.5 py-1 rounded-lg">Promo {a.promo}</span>
                  </div>
                  <p className="text-sm font-semibold text-stone-700">{a.role}</p>
                  <p className="text-xs text-stone-500 flex items-center gap-1.5"><Building className="w-4 h-4 text-orange-500" /> {a.company}</p>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* MEDIATHEQUE VIEW */}
        {activeTab === 'mediatheque' && (
          <div className="space-y-8">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Médiathèque Officielle</h2>
            <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-6">
              {gallery.map(item => (
                <div key={item.id} className="glass-card rounded-3xl overflow-hidden hover-scale group">
                  <img src={item.image} alt={item.title} className="w-full h-52 object-cover transition duration-500 group-hover:scale-105" />
                  <div className="p-5">
                    <h4 className="font-serif font-bold text-stone-900">{item.title}</h4>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* CONTACT VIEW */}
        {activeTab === 'contact' && (
          <div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl space-y-6">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Contact</h2>
            <p className="text-stone-600 text-sm">Secrétariat de la Conférence des Grandes Écoles — ARSTM, Abidjan, Côte d'Ivoire.</p>
          </div>
        )}

        {/* ESPACE MEMBRE VIEW */}
        {activeTab === 'espace-membre' && currentUser && (
          <div className="max-w-xl mx-auto glass-card p-8 rounded-3xl text-center space-y-6">
            <div className="w-16 h-16 mx-auto rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
              <UserCheck className="w-8 h-8 text-orange-600" />
            </div>
            <div>
              <h2 className="font-serif text-2xl font-bold text-stone-900">
                {isAdminLoggedIn ? currentUser.name : `Bonjour, ${currentUser.name}`}
              </h2>
              {!isAdminLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">{currentUser.role} — {currentUser.matricule}</p>
              )}
              {isAdminLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">Accès administrateur</p>
              )}
            </div>
            <button
              onClick={handleLogout}
              className="hover-scale inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-stone-900 text-white font-semibold"
            >
              <LogOut className="w-4 h-4" /> Se déconnecter
            </button>
          </div>
        )}

      </main>

      {/* BARRE EN BAS : APPLE LIQUID GLASS DOCK */}
      <div className="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
        <nav
          ref={navRef}
          onMouseLeave={() => setHoveredTab(null)}
          className="pointer-events-auto relative glass-dock p-2 rounded-full flex items-center gap-1 max-w-full overflow-x-auto no-scrollbar"
        >
          {/* Pilule suiveuse (Apple Liquid Indicator) */}
          <div
            className="absolute top-2 bottom-2 liquid-pill rounded-full pointer-events-none"
            style={{
              left: `${pillStyle.left}px`,
              width: `${pillStyle.width}px`,
              opacity: pillStyle.opacity,
            }}
          />

          {navItems.map(item => {
            const Icon = item.icon;
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                data-tab={item.id}
                onClick={() => setActiveTab(item.id)}
                onMouseEnter={() => setHoveredTab(item.id)}
                className={`relative z-10 flex items-center gap-2 px-4 py-3 rounded-full text-xs font-bold transition-transform duration-300 transform hover:scale-110 active:scale-95 whitespace-nowrap ${
                  isActive || hoveredTab === item.id ? 'text-white' : 'text-stone-700 hover:text-stone-950'
                }`}
              >
                <Icon className="w-4 h-4" />
                <span className="hidden sm:inline">{item.label}</span>
              </button>
            );
          })}
        </nav>
      </div>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
