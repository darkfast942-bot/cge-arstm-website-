const SITE_SALT = "cge-arstm-2026";
const hashSecret = async (id, secret) => {
  const data = new TextEncoder().encode(`${SITE_SALT}|${id}|${secret}`);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
};

// ---- Espace de stockage photos (réservé aux admins) ----
// Stockage local au navigateur (IndexedDB). Le jour où le vrai serveur existe, seules ces 3 fonctions changent.
const MediaStore = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("cge-arstm-media", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async all() {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = db.transaction("photos").objectStore("photos").getAll();
      q.onsuccess = () => res(q.result.sort((a, b) => b.ts - a.ts));
      q.onerror = () => rej(q.error);
    });
  },
  async add(item) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("photos", "readwrite");
      t.objectStore("photos").put(item);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  },
  async remove(id) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("photos", "readwrite");
      t.objectStore("photos").delete(id);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  }
};

// Réduit la photo (900 px max, JPEG) pour qu'elle reste légère.
const fileToDataUrl = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onerror = () => reject(reader.error);
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("image"));
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});
